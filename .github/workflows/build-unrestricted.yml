name: Build (download enabled)

# 直接检出上游最新代码构建：即使同步失败，产出的也永远是最新版
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unrestricted.yml'

concurrency:
  group: build-unrestricted
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: Meloong-Git/PCL
          ref: main
          fetch-depth: 1
          submodules: recursive
          path: src

      - name: Resolve upstream commit
        id: up
        shell: bash
        run: echo "sha=$(git -C src rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Enable MC download
        shell: pwsh
        working-directory: src
        run: |
          $f = "Plain Craft Launcher 2\Modules\ModSecret.vb"
          $raw = Get-Content $f -Raw
          $patched = $raw -replace 'Public Const RestrictMcDownload As Boolean = True', 'Public Const RestrictMcDownload As Boolean = False'
          if ($patched -eq $raw) {
            Write-Error "未找到 RestrictMcDownload = True，上游可能改了实现，中止构建"
            exit 1
          }
          Set-Content -Path $f -Value $patched -NoNewline -Encoding UTF8
          Select-String -Path $f -Pattern 'RestrictMcDownload'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore NuGet
        working-directory: src
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build
        working-directory: src
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

      - name: Collect
        id: collect
        shell: pwsh
        working-directory: src
        run: |
          $exe = "Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe"
          if (!(Test-Path $exe)) {
            $exe = Get-ChildItem -Recurse -Filter "Plain Craft Launcher 2.exe" |
                   Where-Object { $_.FullName -like "*Release*" } |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (!(Test-Path $exe)) { Write-Error "未找到编译产物"; exit 1 }
          $ver = (Get-Item $exe).VersionInfo.FileVersion
          if (-not $ver) { $ver = (Get-Item $exe).VersionInfo.ProductVersion }
          Write-Host "exe=$exe version=$ver"
          "ver=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item $exe "$env:GITHUB_WORKSPACE\out\PCL-$ver-unrestricted.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-${{ steps.collect.outputs.ver }}-unrestricted
          path: out\*.exe
          if-no-files-found: error

      - name: Publish rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $tag = "auto-build"
          $title = "PCL ${{ steps.collect.outputs.ver }} 自动构建"
          $notes = "上游 Meloong-Git/PCL @ ${{ steps.up.outputs.sha }}，已开启 MC 下载。构建于 ${{ github.run_id }}。"
          $asset = "out\PCL-${{ steps.collect.outputs.ver }}-unrestricted.exe"

          gh release edit $tag --title $title --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release 不存在，改为创建"
            gh release create $tag --title $title --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { Write-Error "创建 release 失败"; exit 1 }
          }

          gh release upload $tag $asset --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "上传附件失败"; exit 1 }
          gh release view $tag --json assets,body
